name: Global PyPI Automation Deployment

on:
  push:
    branches:
      - main

jobs:
  publish-to-pypi:
    name: Build Package and Upload to Global Registry
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Check out source code repository
        uses: actions/checkout@v4

      - name: Set up modern Python compilation node
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install official enterprise building engines
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Compile module into distribution packages
        run: python -m build

      - name: Securely upload module live to PyPI registry
        uses: pypa/gh-action-pypi-publish@release/v1
